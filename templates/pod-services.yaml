{{- $replicas := .Values.replicaCount | int -}}
{{- range $i, $_ := until $replicas }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $.Chart.Name }}-{{ $i }}
  labels:
    app: {{ $.Release.Name }}-{{ $.Chart.Name }}
  namespace: {{ $.Release.Namespace }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
  selector:
    statefulset.kubernetes.io/pod-name: {{ $.Release.Name }}-{{ $.Chart.Name }}-{{ $i }}
---
{{- end }}
