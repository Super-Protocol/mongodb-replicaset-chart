apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "fullname" $ }}
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ template "fullname" $ }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ template "fullname" $ }}
  template:
    metadata:
      labels:
        app: {{ template "fullname" $ }}
    spec:
      volumes:
        {{- if not .Values.persistence.enabled }}
        - name: {{ template "fullname" $ }}-data
          emptyDir: {}
        {{- end }}
        - name: keyfile
          secret:
            secretName: {{ template "fullname" $ }}-keyfile
      containers:
        - name: mongo
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - "bash"
            - "-c"
            - |
              mkdir -p /var/run/mongodb-rs
              cp /etc/mongo-keyfile/key /var/run/mongodb-rs/key
              chmod 400 /var/run/mongodb-rs/key
              chown 999:999 /var/run/mongodb-rs/key
              exec docker-entrypoint.sh $$@
          args:
            - "mongod"
            - "--bind_ip_all"
            - "--replSet={{ .Values.replicaSet.name }}"
            - "--auth"
            - "--keyFile=/var/run/mongodb-rs/key"
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: {{ template "fullname" $ }}-data
              mountPath: /data/db
            - name: keyfile
              mountPath: /etc/mongo-keyfile
              readOnly: true
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: {{ .Values.auth.rootUser | quote }}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "fullname" $ }}-auth
                  key: root-password
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: {{ template "fullname" $ }}-data
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        storageClassName: {{ .Values.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
